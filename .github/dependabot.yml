version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-runtime:
        dependency-type: production
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Keep compiler upgrades deliberate: TypeScript majors can change type
      # discovery and module-resolution behavior.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # Match the declarations to the Node 22 runtime used by CI and Docker.
      - dependency-name: "@types/node"
        versions:
          - ">=23"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
