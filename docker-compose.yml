services:
  glpi-mcp:
    image: ghcr.io/tinisys-it-solutions/glpi-mcp-docker:latest
    pull_policy: always
    container_name: glpi-mcp
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    environment:
      GLPI_URL: ${GLPI_URL}
      GLPI_API_MODE: ${GLPI_API_MODE:-legacy}
      GLPI_API_VERSION: ${GLPI_API_VERSION:-2.3}
      GLPI_AUTH_MODE: ${GLPI_AUTH_MODE:-service_account}
      GLPI_APP_TOKEN: ${GLPI_APP_TOKEN}
      GLPI_USER_TOKEN: ${GLPI_USER_TOKEN}
      GLPI_USERNAME: ${GLPI_USERNAME:-}
      GLPI_PASSWORD: ${GLPI_PASSWORD:-}
      GLPI_OAUTH_CLIENT_ID: ${GLPI_OAUTH_CLIENT_ID:-}
      GLPI_OAUTH_CLIENT_SECRET: ${GLPI_OAUTH_CLIENT_SECRET:-}
      GLPI_OAUTH_USERNAME: ${GLPI_OAUTH_USERNAME:-}
      GLPI_OAUTH_PASSWORD: ${GLPI_OAUTH_PASSWORD:-}
      GLPI_OAUTH_REDIRECT_URI: ${GLPI_OAUTH_REDIRECT_URI:-}
      GLPI_TIMEOUT_MS: ${GLPI_TIMEOUT_MS:-15000}
      GLPI_MAX_RETRIES: ${GLPI_MAX_RETRIES:-2}
      GLPI_DEBUG: ${GLPI_DEBUG:-}
      MCP_PORT: ${MCP_PORT:-8000}
      MCP_PATH: ${MCP_PATH:-/mcp}
      MCP_HEALTH_PATH: ${MCP_HEALTH_PATH:-/healthz}
      MCP_SESSION_TIMEOUT_MS: ${MCP_SESSION_TIMEOUT_MS:-600000}
      MCP_LOG_LEVEL: ${MCP_LOG_LEVEL:-info}
      MCP_UPLOAD_ROOT: ${MCP_UPLOAD_ROOT:-/uploads}
      MCP_UPLOAD_MAX_BYTES: ${MCP_UPLOAD_MAX_BYTES:-26214400}
    ports:
      - "${MCP_BIND_ADDRESS:-127.0.0.1}:${MCP_PORT:-8000}:${MCP_PORT:-8000}"
    volumes:
      - "${MCP_UPLOAD_SOURCE:-./uploads}:/uploads:ro"
    networks:
      - glpi-mcp
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - \"http://127.0.0.1:$${MCP_PORT}$${MCP_HEALTH_PATH}\" | grep -q ok"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  glpi-mcp:
    name: glpi-mcp
    driver: bridge
